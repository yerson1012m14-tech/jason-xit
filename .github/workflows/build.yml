name: Build JASON XIT iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup & Select Xcode Version
        run: |
          echo "=== Xcode disponible en el Runner ==="
          xcodebuild -version
          
          # Si Xcode 16 está disponible en el runner, usarlo; de lo contrario mantener Xcode 15
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          
          echo "=== Xcode Seleccionado ==="
          xcodebuild -version

      - name: Install XcodeGen & Tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen ldid || true
          xcodegen --version || true

      - name: Generate Xcode Project with Compatibility
        run: |
          rm -rf JASONXIT.xcodeproj
          xcodegen generate --spec project.yml
          
          # Forzar formato de compatibilidad Xcode 14/15 (objectVersion 56) para evitar error 74 (future format 77)
          if [ -f "JASONXIT.xcodeproj/project.pbxproj" ]; then
            echo "Ajustando objectVersion para máxima compatibilidad..."
            sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/objectVersion = [0-9]*/objectVersion = 56/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || true
            sed -i '' 's/compatibilityVersion = "[^"]*"/compatibilityVersion = "Xcode 14.0"/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/compatibilityVersion = "[^"]*"/compatibilityVersion = "Xcode 14.0"/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || true
          fi

      - name: Build Native iOS App (.app)
        run: |
          mkdir -p build
          
          xcodebuild clean build \
            -project JASONXIT.xcodeproj \
            -scheme JASONXIT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package & Inject Entitlements into IPA
        run: |
          rm -rf Payload *.ipa
          mkdir -p Payload
          
          # Localizar el binario compilado .app
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Buscando en directorio alternativo..."
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          echo "App localizada en: $APP_PATH"
          cp -R "$APP_PATH" Payload/JASONXIT.app
          
          # Inyección de Entitlements para TrollStore, AltStore, Sideloadly, Scarlet
          if [ -f "JASONXIT/Entitlements.plist" ]; then
            echo "Firmando con ldid y Entitlements.plist..."
            ldid -SJASONXIT/Entitlements.plist Payload/JASONXIT.app/JASONXIT 2>/dev/null || true
            ldid -SJASONXIT/Entitlements.plist Payload/JASONXIT.app 2>/dev/null || true
            codesign -s - --force --deep --entitlements JASONXIT/Entitlements.plist Payload/JASONXIT.app 2>/dev/null || true
          else
            codesign -s - --force --deep Payload/JASONXIT.app 2>/dev/null || true
          fi
          
          # Empaquetado final IPA
          zip -qry JASONXIT_v2.0.ipa Payload
          ls -lh JASONXIT_v2.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JASONXIT_v2.0_iOS_IPA
          path: JASONXIT_v2.0.ipa
          if-no-files-found: error
