name: Build JASON XIT iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Xcode Environment
        run: |
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== SDKs Available ==="
          xcodebuild -showsdks

      - name: Install XcodeGen & ldid
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen ldid || brew link --overwrite xcodegen || true
          xcodegen --version || true

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          rm -rf JASONXIT.xcodeproj
          xcodegen generate --spec project.yml

      - name: Build Native iOS App (.app)
        run: |
          mkdir -p build/Release-iphoneos
          
          xcodebuild build \
            -project JASONXIT.xcodeproj \
            -scheme JASONXIT \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package & Sign IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/JASONXIT.app Payload/

          # Entitlements & Ad-Hoc Sign with ldid
          if [ -f "JASONXIT/Entitlements.plist" ]; then
            ldid -SJASONXIT/Entitlements.plist Payload/JASONXIT.app/JASONXIT || true
            ldid -SJASONXIT/Entitlements.plist Payload/JASONXIT.app || true
          else
            ldid -S Payload/JASONXIT.app/JASONXIT || true
            ldid -S Payload/JASONXIT.app || true
          fi

          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD || echo 'latest')"
          IPA_NAME="JASONXIT_v2.0_b${BUILD_NUM}_${SHORT_SHA}.ipa"

          zip -vr "${IPA_NAME}" Payload
          echo "IPA_NAME=${IPA_NAME}" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
