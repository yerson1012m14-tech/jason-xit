name: Build JASON XIT iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup & Select Xcode Version
        run: |
          echo "=== Xcode disponible en el Runner ==="
          xcodebuild -version
          
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          
          echo "=== Xcode Seleccionado ==="
          xcodebuild -version

      - name: Install XcodeGen & Tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen ldid || true
          xcodegen --version || true

      - name: Generate Xcode Project
        run: |
          rm -rf JASONXIT.xcodeproj
          xcodegen generate --spec project.yml
          
          if [ -f "JASONXIT.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/objectVersion = [0-9]*/objectVersion = 56/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || true
            sed -i '' 's/compatibilityVersion = "[^"]*"/compatibilityVersion = "Xcode 14.0"/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/compatibilityVersion = "[^"]*"/compatibilityVersion = "Xcode 14.0"/g' JASONXIT.xcodeproj/project.pbxproj 2>/dev/null || true
          fi

      - name: Build Native iOS App (.app)
        run: |
          mkdir -p build
          
          xcodebuild clean build \
            -project JASONXIT.xcodeproj \
            -scheme JASONXIT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package & Sign IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontró el bundle .app compilado."
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Aplicar pseudo-firma ad-hoc con ldid si está disponible
          if command -v ldid &> /dev/null; then
            if [ -f "JASONXIT/Entitlements.plist" ]; then
              ldid -SJASONXIT/Entitlements.plist "Payload/$(basename "$APP_PATH")" || true
            else
              ldid -S "Payload/$(basename "$APP_PATH")" || true
            fi
          fi
          
          zip -r9 JASONXIT_v2.0.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JASONXIT_v2.0.ipa
          path: JASONXIT_v2.0.ipa
          retention-days: 7
