name: Build JASONXIT IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build Xcode Project
      run: |
        xcodebuild -project JASONXIT.xcodeproj \
                   -scheme JASONXIT \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build/DerivedData \
                   USER_HEADER_SEARCH_PATHS='$(SRCROOT)/**' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_REQUIRED=NO \
                   clean build

    - name: Package IPA
      run: |
        mkdir -p build/Payload
        cp -r build/DerivedData/Build/Products/Release-iphoneos/JASONXIT.app build/Payload/
        cd build
        zip -r JASONXIT.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JASONXIT-Unsigned
        path: build/JASONXIT.ipa
